# The hand-written half of the manifest (07-c4-plugin-sdk.md section 2; ADR-048).
# plugingen writes the generated half below the marker from the plugin's value:
# go run ./tools/plugingen -write <dir>. CI fails when it differs.
# A control row of the test distribution, under the owner aiops-test, which is not
# reserved (ADR-048 decision 14; ADR-059 decision 9; ADR-060 decision 28).
manifestVersion: "1.0"
id: aiops-test/test-submit
version: 0.1.0
title: Test submit
description: Submits a generation to reload when a control file changes.
license: Apache-2.0
publisher: {id: aiops-test}
stability: experimental
scope: [process]
runtimes: [inproc]
# --- generated by plugingen from the Spec; CI fails on a difference ---
uses:
  - {key: clock, major: 0, as: need}
  - {key: cmdline, major: 0, as: need}
  - {key: reload, major: 0, as: need}
provides: []
registers: []
hooks: []
configSchema: {}
durable: []
requires:
  pluginApi: "0.3"
  definitions:
    clock: ["0.1"]
    launch: ["0.2"]
    reload: ["0.1"]
