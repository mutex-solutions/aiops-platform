# The hand-written half of the manifest (07-c4-plugin-sdk.md section 2; ADR-048).
# plugingen writes the generated half below the marker from the plugin's value:
# go run ./tools/plugingen -write <dir>. CI fails when it differs.
# A plugin of the test distribution, under the owner aiops-test, which is not reserved
# (ADR-048 decision 14; ADR-060 decision 28).
manifestVersion: "1.0"
id: aiops-test/toy-consumer
version: 0.1.0
title: Toy consumer
description: Needs toy.store and the spine, logs its volatile note and can put the spine under load.
license: Apache-2.0
publisher: {id: aiops-test}
stability: experimental
scope: [process]
runtimes: [inproc]
# --- generated by plugingen from the Spec; CI fails on a difference ---
uses:
  - {key: logger, major: 0, as: need}
  - {key: toy.spine, major: 0, as: need}
  - {key: toy.store, major: 0, as: need}
provides: []
registers: []
hooks: []
configSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  additionalProperties: false
  properties:
    applyDelay:
      pattern: ^[-+]?(0|(([0-9]+(\.[0-9]*)?|\.[0-9]+)(ns|us|µs|μs|ms|s|m|h))+)$
      type: string
    callEvery:
      pattern: ^[-+]?(0|(([0-9]+(\.[0-9]*)?|\.[0-9]+)(ns|us|µs|μs|ms|s|m|h))+)$
      type: string
    callHold:
      pattern: ^[-+]?(0|(([0-9]+(\.[0-9]*)?|\.[0-9]+)(ns|us|µs|μs|ms|s|m|h))+)$
      type: string
    note:
      type: string
      x-aiops-volatile: true
  type: object
durable: []
requires:
  pluginApi: "0.3"
  definitions:
    spine: ["0.1"]
    toy: ["0.1"]
