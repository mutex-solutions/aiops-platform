# The distribution manifest of the test distribution, the part the launcher reads
# (08-profiles-roadmap-adrs.md:451): the release manifest (dist/dist.yaml) plus the
# bindings of the toy keys and of the two control rows. No shipped distribution has it.
providers:
  configRefsDryRun: [aiops/config-refs]
  configRefsReady: [aiops/config-refs]
  # toy.policy is provider-bound: only toy-provider may provide it. The rogue-provider
  # fault provides it too, and the gate denies that row (check 7).
  toy.policy: [aiops-test/toy-provider]
consumers:
  appExit: [aiops/restart-policy, aiops/cli]
  registry: [aiops/restart-policy]
  loader: [aiops/reload, aiops-test/test-state]
  # test-state composes a candidate through profileContext.
  profileContext: [aiops/loader, aiops/reload, aiops/readiness, aiops/command-profile, aiops-test/test-state]
  # reload-socket submits as in the release; test-submit submits; test-state reads the
  # results.
  reload: [aiops/reload-socket, aiops-test/test-submit, aiops-test/test-state]
  # The command rows that call the operations library, as in the release (ADR-061
  # decision 20).
  operations: [aiops/command-key, aiops/command-trust]
sealedHooks:
  internal/status: [aiops/restart-policy, aiops/readiness]
  internal/config: [aiops/config-refs]
# toy.spine is required because toy.store is: the provider of a required key must not
# need a provider outside the required set (08-profiles-roadmap-adrs.md:503).
# configRefsReady is not listed, as in the release manifest: the launcher adds it where a
# required row holds a reference (ADR-059 decision 18) and, by decision 24, where an
# active provider of a required key in the root realm holds one.
requiredKeys: [clock, toy.spine, toy.store]
requiredRows: [loader, restart-policy, reload, readiness]
