# The limits of the test distribution (boot.ParseLimits): short, so that a fault that
# passes a deadline is seen within seconds. The documents give no value for any of
# them; the test limits of 1 s are a default answer of round 1 that ADR-059 decision 39
# confirms. The release defaults are in dist/limits.yaml. The binary embeds this file,
# and the harness of the suites (harness.Limits) reads it, so every suite runs on these
# values.
loadDeadline: 1s
drainDeadline: 1s
disposeDeadline: 1s
shutdownBound: 10s
leakGrace: 500ms
