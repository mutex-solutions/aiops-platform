# Layer 4 patch for the failure matrix: the fault plugin slow-apply as an required row,
# with a row that depends on what it provides.
- insert:
    - {id: fault, plugin: aiops-test/slow-apply, roles: [api], required: true, config: {delay: 1h}}
    - {id: dependant, plugin: aiops-test/toy-consumer, roles: [api], inject: [toy.fault]}
