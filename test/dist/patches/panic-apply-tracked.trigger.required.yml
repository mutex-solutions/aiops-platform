# Layer 4 patch for the failure matrix: a required row whose tracked goroutine panics while
# running, once the file run/fault.go exists.
- insert:
    - {id: fault, plugin: aiops-test/panic-apply, roles: [api], required: true, config: {mode: tracked, trigger: fault.go}}
    - {id: dependant, plugin: aiops-test/toy-consumer, roles: [api], inject: [toy.fault]}
