# Layer 4 patch for the failure matrix: the fault plugin leaky-goroutine as an optional row,
# with a row that depends on what it provides.
- insert:
    - {id: fault, plugin: aiops-test/leaky-goroutine, roles: [api], config: {hold: 5s}}
    - {id: dependant, plugin: aiops-test/toy-consumer, roles: [api], inject: [toy.fault]}
