# Layer 4 patch for the failure matrix: the fault plugin slow-dispose as an required row,
# with a row that depends on what it provides.
- insert:
    - {id: fault, plugin: aiops-test/slow-dispose, roles: [api], required: true, config: {delay: 5s}}
    - {id: dependant, plugin: aiops-test/toy-consumer, roles: [api], inject: [toy.fault]}
