# Layer 4 patch for the failure matrix: a row that makes a goroutine of its own, which
# panics while running, once the file run/fault.go exists.
- insert:
    - {id: fault, plugin: aiops-test/panic-apply, roles: [api], config: {mode: untracked, trigger: fault.go}}
    - {id: dependant, plugin: aiops-test/toy-consumer, roles: [api], inject: [toy.fault]}
