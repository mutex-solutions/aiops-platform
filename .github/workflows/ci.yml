name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  # Every build has the tag grpcnotrace, which drops golang.org/x/net/trace and the two
  # handlers its init registers on http.DefaultServeMux (ADR-020 decision 27), as the
  # Makefile and plugingen.BuildFlags have it.
  GOFLAGS: -mod=readonly -tags=grpcnotrace

jobs:
  hygiene:
    name: Hygiene and secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.8" # toolchain directive in go.mod
      - name: Local paths, private addresses, denylist
        env:
          HYGIENE_DENYLIST: ${{ secrets.HYGIENE_DENYLIST }}
        run: scripts/ci/hygiene.sh
      - name: Secret scan over full history
        run: |
          GOFLAGS= go install github.com/zricethezav/gitleaks/v8@v8.18.4
          "$(go env GOPATH)/bin/gitleaks" detect --redact --no-banner --verbose --no-color --source .

  test:
    name: Build, vet, race tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.8" # toolchain directive in go.mod
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go build ./...
      - run: go vet ./...
      # -short: the three suites that build and run the test binary (test/failure-matrix,
      # test/recomposition, test/loader-smoke) skip themselves, loudly; the s1-suites job
      # runs them without it. Nothing else in the repository reads -short.
      - run: go test -race -short -count=1 ./...
      - name: reload-socket peer credentials
        # ADR-062 decision 18 and ADR-060 decision 36: a client run as root enters run/
        # and is refused with peer, and a client run as another unprivileged user cannot
        # open the socket. The runner has passwordless sudo; the step fails, and does not
        # skip, when it cannot run them. make check does not run it.
        run: make peer-check
      - name: Kernel module build, vet, race tests
        working-directory: sdk/kernel
        run: |
          go build ./...
          go vet ./...
          go test -race -count=1 ./...
      - name: Testkit module build, vet, race tests
        working-directory: sdk/testkit
        run: |
          go build ./...
          go vet ./...
          go test -race -count=1 ./...
      - name: SDK module build, vet, race tests
        # The module github.com/mutex-solutions/aiops-platform/sdk, rooted at sdk/ (ADR-060
        # decision 54); sdk/kernel and sdk/testkit are nested modules of their own.
        working-directory: sdk
        run: |
          go build ./...
          go vet ./...
          go test -race -count=1 ./...
      - name: Handshake freeze
        # ADR-060 decision 42 (Q6 (a)): sdk/remote/handshake/handshake.proto changes only by
        # an added field. The SDK module step runs it too; this step names it.
        working-directory: sdk
        run: go test -count=1 ./remote/handshake
      - name: Served go.mod copies
        # ADR-060 decisions 21 and 36; ADR-044 decision 23: the served copy of the go.mod
        # of the root module and of each SDK module names the release version in its
        # require lines of the repository's modules, holds no replace line, and differs
        # from the repository's file in nothing else. The race tests run it too; this
        # step names it.
        run: go test -count=1 -run '^TestServedGoMod$' ./internal/builder
      - name: Kernel statement coverage profile
        working-directory: sdk/kernel
        run: go test -count=1 -coverprofile=cover.out ./...
      - name: Kernel structural checks
        run: |
          go run ./tools/kernelcheck modfile sdk/kernel
          go run ./tools/kernelcheck vocab sdk/kernel tools/kernelcheck/vocabulary.txt
          go run ./tools/kernelcheck lines sdk/kernel 8200
          go run ./tools/kernelcheck testctor .
          go run ./tools/kernelcheck coverage sdk/kernel/cover.out github.com/mutex-solutions/aiops-platform/sdk/kernel
      - name: SDK module require list
        # 00-decisions.md §4.3: sdk requires sdk/kernel, and sdk/testkit for its tests only;
        # pgx v5 joins at S3 (ADR-060 decision 4).
        run: go run ./tools/kernelcheck modfile sdk github.com/mutex-solutions/aiops-platform/sdk/kernel github.com/mutex-solutions/aiops-platform/sdk/testkit
      - name: Plugin package, plugingen, aiopsctl, builder and operations library line caps
        # ADR-060 decision 35: the package sdk/plugin, plugingen, cmd/aiopsctl with its
        # launcher internal/aiopsctl under the one 2,500 of its row, the builder (3,500
        # since the note of 2026-11-25, which raised it from 3,000) and the operations
        # library,
        # plugins/operations, provisional caps during S2a. The row
        # package, internal/ skipped, and its internal package, which holds the client of
        # reload-socket (ADR-061 decision 41; ADR-062 decision 16), are capped each, at
        # 4,500 since the second note of 2026-11-24, which raised them from 3,500.
        run: |
          go run ./tools/kernelcheck lines sdk/plugin 2500 provisional
          go run ./tools/kernelcheck lines internal/plugingen 1500 provisional
          go run ./tools/kernelcheck lines cmd/aiopsctl:internal/aiopsctl 2500 provisional
          go run ./tools/kernelcheck lines internal/builder 3500 provisional
          go run ./tools/kernelcheck lines plugins/operations 4500 provisional internal
          go run ./tools/kernelcheck lines plugins/operations/internal/operations 4500 provisional
      - name: pluginApi check
        # ADR-060 decision 8: fails when the exported API of sdk/kernel or sdk/plugin
        # differs from tools/pluginapi/api.txt and plugin.APIVersion was not raised.
        run: go run ./tools/pluginapi .
      - name: Import boundaries (U2)
        # docs/architecture/07-c4-plugin-sdk.md:27-48; the import boundary U2 of ADR-054
        # decision 13 reads the modules, plugins and importers of the upstream register.
        # The closure of cmd/aiops holds no fake or sdk/testkit package, no part of the
        # toolbox that aiopsctl alone links (ADR-061 decision 21) and no package of
        # golang.org/x/mod but semver and sumdb/note, which sigstore-go links, since the
        # module zip is the toolbox's (ADR-044, Consequences), and the link guard
        # of ADR-060 decision 28 keeps every package under test/ and examples/ out of the
        # closures of cmd/aiops and cmd/aiopsctl.
        run: go run ./tools/kernelcheck imports . tools/upstream-components.yaml
      - name: Plugin vet
        # plugin-system-2026-11.md §14 (T0 Static); allow-var and allow-go exemptions are counted in the output.
        run: go run ./tools/kernelcheck pluginvet plugins loader boot
      - name: Definition lint
        # Standing rule 1 (08-profiles-roadmap-adrs.md:676; ADR-060 decision 32): each
        # definition under sdk/def has its files, a provider and a consumer among the
        # plugins of the distributions, and keeps the static rules of 07-c4-plugin-sdk.md:514-520.
        run: go run ./tools/deflint .
      - name: Manifest parity
        # ADR-060 decisions 11 and 36 (08-profiles-roadmap-adrs.md:1257): the generated half
        # of every plugin.yaml, read as data, and the generated tests beside it are what
        # plugingen writes from the plugin's value; the signed distribution manifest of each
        # binary built in the repository is what the builder writes from its build, with
        # the licences its scan detects (ADR-060 decisions 20 and 28; ADR-044 decision 3),
        # and the release's serves names no definition outside sdk/def (ADR-060 decision 28).
        run: go run ./tools/plugingen .
      - name: Register check (U7), name lint (U1) and suite neutrality (U3)
        # ADR-054 decision 12, ADR-060 decisions 36 and 51: every module of the package
        # graphs has an entry of tools/upstream-components.yaml at its pin, and no entry
        # breaks the schema or a clause of decision 12. Reads the module cache only.
        # ADR-054 decisions 14, 15 and 22: no name of an entry in sdk/, boot/, loader/,
        # the ids of the plugins and the documentation places of 00-decisions.md outside
        # the places the register gives it.
        run: go run ./tools/register .
      - name: Boot and loader statement coverage profiles
        run: |
          go test -count=1 -coverprofile=cover-boot.out ./boot
          go test -count=1 -coverprofile=cover-loader.out ./loader
      - name: Boot structural checks
        # Line cap: 10,500, provisional during S2a (ADR-060 decision 35 and its note of
        # 2026-11-24, which raised it from 9,000), in place of the 6,800 fixed at the S1
        # exit (ADR-059 decision 11); the manifest reader adds to it (ADR-048 decision 18).
        # Its vocabulary list holds the domain words and upstream names of ADR-060 decision 45
        # and not tenant, which boot legitimately handles (a scope class of its closed
        # vocabulary). An upstream name leaves it in the commit that adds the register entry
        # carrying it, from which the name lint U1 reads it (ADR-054 decisions 14 and 20).
        run: |
          go run ./tools/kernelcheck lines boot 10500 provisional
          go run ./tools/kernelcheck vocab boot tools/kernelcheck/vocabulary-boot.txt
          go run ./tools/kernelcheck coverage cover-boot.out github.com/mutex-solutions/aiops-platform/boot
      - name: Loader structural checks
        # Line cap fixed at the S1 exit (ADR-059 decision 11): measured 1000 lines + 10%, rounded up to the next 100.
        run: |
          go run ./tools/kernelcheck lines loader 1300
          go run ./tools/kernelcheck vocab loader tools/kernelcheck/vocabulary-loader.txt
          go run ./tools/kernelcheck coverage cover-loader.out github.com/mutex-solutions/aiops-platform/loader
      - name: Toy definition line caps
        # ADR-060 decision 35: each toy definition package, its fake and its suite are
        # packages of their own, 800 lines each, provisional until the S2a exit.
        run: |
          for d in echoers stampers; do
            go run ./tools/kernelcheck lines sdk/def/$d/v0 800 provisional fake conformance
            go run ./tools/kernelcheck lines sdk/def/$d/v0/fake 800 provisional
            go run ./tools/kernelcheck lines sdk/def/$d/v0/conformance 800 provisional
          done
      - name: Definition suite line caps
        # ADR-060 decision 35: a definition's suite is a package of its own, 800 lines,
        # provisional until the S2a exit.
        run: |
          go run ./tools/kernelcheck lines sdk/def/clock/v0/conformance 800 provisional
          go run ./tools/kernelcheck lines sdk/def/composition/v0/conformance 800 provisional
          go run ./tools/kernelcheck lines sdk/def/configrefs/v0/conformance 800 provisional
          go run ./tools/kernelcheck lines sdk/def/reload/v0/conformance 800 provisional
          go run ./tools/kernelcheck lines sdk/def/launch/v0/conformance 800 provisional
      - name: Command line caps
        # ADR-060 decision 35 and ADR-061, Consequences: the commands definition, its fake
        # and its suite, 800 lines each; the cli row and each command row, 1,500 each,
        # provisional until the S2a exit.
        run: |
          go run ./tools/kernelcheck lines sdk/def/commands/v0 800 provisional fake conformance
          go run ./tools/kernelcheck lines sdk/def/commands/v0/fake 800 provisional
          go run ./tools/kernelcheck lines sdk/def/commands/v0/conformance 800 provisional
          for p in cli command-profile command-plugin command-trust command-dist command-key; do
            go run ./tools/kernelcheck lines plugins/$p 1500 provisional
          done
      - name: Operations definition line caps
        # ADR-060 decision 35 and ADR-061: the operations definition, its fake and its
        # suite are packages of their own, provisional until the S2a exit: the definition
        # 800 lines, the fake and the suite 1,300 each since the note of 2026-11-25, which
        # raised them from 1,000.
        run: |
          go run ./tools/kernelcheck lines sdk/def/operations/v0 800 provisional fake conformance
          go run ./tools/kernelcheck lines sdk/def/operations/v0/fake 1300 provisional
          go run ./tools/kernelcheck lines sdk/def/operations/v0/conformance 1300 provisional
      - name: plugin check and T3 boot of every plugin
        # ADR-060 decision 32, standing rule 2, and decision 36; ADR-020 decision 13;
        # ADR-061 decision 23: a Go test builds aiopsctl, makes a throwaway home trust the
        # manifest it embeds through a key made in the test, and runs plugin check on every
        # plugin under plugins/ and examples/, the five core plugins of S1 included; a T3
        # boot runs a row of each, in the test binary or in the cli profile of that
        # aiopsctl. The race tests skip both cases (-short); the step fails, and does not
        # skip, when they do not run (see the plugin-check target of the Makefile).
        run: make plugin-check

  s1-suites:
    name: S1 exit suites on the built binary
    # ADR-059 decisions 3 and 5, 08-profiles-roadmap-adrs.md:693: the failure matrix
    # (process-scope columns), the recomposition suite and the loader smoke test build
    # test/dist/cmd/aiops-test and run it. A cell that does not do what the table says fails
    # this job; there is no list of known deviations (ADR-059 decisions 12 to 15).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.8" # toolchain directive in go.mod
      # Race-built, binary included; any race report of any process fails the job (see the
      # s1-suites target of the Makefile).
      - run: make s1-suites

  builder:
    name: Builder, licence report and dist build on the local path
    # ADR-060 decisions 22 and 36; ADR-044: the corpus of the licence classifier against
    # the pinned SPDX data; the cases of the builder on the tree of the pinned toolchain
    # module, the licence report of aiops and aiopsctl with THIRD_PARTY_LICENSES/, the
    # NOTICE texts and the MPL-2.0 lines among them; dist build on the local path, then
    # dist sign and dist use of what it wrote; and the test release built in two phases
    # with a throwaway release key, with the aiopsctl of that distribution (ADR-060
    # decision 38; see the builder target of the Makefile). Nothing is pushed or
    # published.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.8" # toolchain directive in go.mod
      - run: make builder

  builder-image:
    name: Builder image, release build and dist build on the image path
    # ADR-060 decisions 22 and 36; ADR-044 decisions 1, 3 to 6 and 17; ADR-020 decision
    # 13: the release built in two phases, the builder image written from
    # dist/builder/image.yaml on no base layer, the licence report of the release image
    # and the release aiopsctl, the MPL-2.0 release check of ADR-044 decision 6
    # (tools/mplsources), and a site's dist build on the image path, run in the
    # runner's container runtime and compared with the local path (see the builder-image
    # target of the Makefile). The registry is the case's own, on the loopback interface;
    # nothing is pushed or published, and the pulled image is removed.
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.8" # toolchain directive in go.mod
      - run: make builder-image

  s2a-exit:
    name: S2a exit, the clean machine on the builder image
    # ADR-060 decisions 30, 31 and 36; ADR-047 decision 15: test/authoring builds the
    # test release in two phases with a throwaway release key from the modules it serves
    # at a pre-release version in a file-based module proxy, runs the pinned registry
    # image inside the job, and drives the author's repository, the pack author's machine
    # and the clean machine, each as containers on a network of its own that reaches the
    # registry and, from the author's repository, the module proxy, which a container
    # serves, with a container runtime of its own on that network where it has one; the
    # clean machine's builds run on the builder image and its kernel runs as a container
    # on the home it bound read-only (see the s2a-exit target of the Makefile).
    # Race-built; a race report or a skip fails the job. Nothing is pushed or published
    # outside the job, and no key outlives it.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.8" # toolchain directive in go.mod
      - run: make s2a-exit EXIT_BUILDERS=image

  s2a-exit-local:
    name: S2a exit, the clean machine on a local toolchain
    # ADR-060 decision 30: the second job runs the clean machine's steps with a local
    # toolchain, the pinned toolchain module that the module proxy serves; the rest is the
    # s2a-exit job's.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.8" # toolchain directive in go.mod
      - run: make s2a-exit EXIT_BUILDERS=local

  cosign:
    name: cosign and aiopsctl, both ways in key mode
    # ADR-060 decision 36; ADR-020 decisions 1, 2 and 4 (07-c4-plugin-sdk.md:75, :1852):
    # cosign verifies an artifact and a distribution manifest that aiopsctl signs, and
    # aiopsctl verifies ones that cosign signs, on a registry inside the case, with keys
    # made in it (see the cosign target of the Makefile). cosign v3.1.4 is built from its
    # module with go install, by the toolchain go1.27.4 that its go.mod needs, each
    # checked against the checksum database; it is never baked into an image
    # (ADR-060 decision 34). Nothing is pushed or published, and no key outlives the case.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.8" # toolchain directive in go.mod
      - run: make cosign

  templates:
    name: Templates of plugin new
    # ADR-060 decisions 24 and 36 (08-profiles-roadmap-adrs.md:1263; 07-c4-plugin-sdk.md:1563):
    # through the built aiopsctl on a home that trusts it with a throwaway key, a plugin
    # generated from the template of each registry compiles, passes T0 and the generated
    # tests under -race, and fails conformance with exactly one line per obligation, so
    # a template cannot fall behind its definition. The connector template's pack names
    # the suite binary that this aiopsctl does not carry; the builder job runs its case
    # on the aiopsctl of the test release (ADR-060 decision 24, note of 2026-11-26).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.8" # toolchain directive in go.mod
      - run: make templates

  postgres:
    name: PostgreSQL probes
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        # Pin from docs/design/s0-reference-pins.md. Trust auth on a throwaway
        # service container: no credential exists to leak.
        image: postgres:16.15-trixie@sha256:43f9275df91e012c3da3d86bea5d7bb5e67a473296cc906c5f9e80b8176b1a37
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DSN_BASE: postgres://postgres@127.0.0.1:5432
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.8" # toolchain directive in go.mod
      - name: Create one dedicated database per probe
        run: |
          for db in s0tx s0workers s0restart s0restartfull s0typed s0probe; do
            psql "$DSN_BASE/postgres" -v ON_ERROR_STOP=1 -c "CREATE DATABASE $db"
          done
      - name: Transaction atomicity probe
        env:
          S0_ADMIN_DSN: ${{ env.DSN_BASE }}/s0tx?sslmode=disable
          S0_EXPECT_DATABASE: s0tx
        run: go test -race -count=1 -v ./plugins/jobs-river/internal/s0txprobe
      - name: Worker probe
        env:
          S0_ADMIN_DSN: ${{ env.DSN_BASE }}/s0workers?sslmode=disable
          S0_EXPECT_DATABASE: s0workers
        run: go test -race -count=1 -v ./plugins/jobs-river/internal/s0workers
      - name: Worker client restart, 30 cycles (smoke, not the full restart gate)
        env:
          S0_ADMIN_DSN: ${{ env.DSN_BASE }}/s0restart?sslmode=disable
          S0_EXPECT_DATABASE: s0restart
          S0_WORKER_RESTART_RUN: "1"
          S0_WORKER_RESTART_CLIENT_CYCLES: "30"
        run: go test -race -count=1 -v -timeout 25m -run '^TestWorkerRestartDiagnostic$' ./plugins/jobs-river/internal/s0workers
      - name: Full restart gate at reduced scale (informational, not acceptance)
        # Timing bounds on a shared runner are noisy; this only shows the
        # harness still runs end to end. The frozen-scale run is restart-full.yml.
        continue-on-error: true
        env:
          S0_ADMIN_DSN: ${{ env.DSN_BASE }}/s0restartfull?sslmode=disable
          S0_EXPECT_DATABASE: s0restartfull
          S0_WORKER_RESTART_FULL: "1"
          S0_WORKER_RESTART_FULL_CYCLES: "1"
          S0_WORKER_RESTART_FULL_COMBINED_CYCLES: "1"
          S0_WORKER_RESTART_FULL_WARMUP_SECONDS: "5"
          S0_WORKER_RESTART_FULL_WINDOW_SECONDS: "20"
          S0_WORKER_RESTART_FULL_RECOVERY_IDS: "100"
          GOMAXPROCS: "8"
        run: go test -count=1 -v -timeout 15m -run '^TestWorkerRestartFullGate$' ./plugins/jobs-river/internal/s0workers
      - name: Full restart gate at reduced scale, kernel-owned resources (informational, not acceptance)
        # Same as the step above with the pool, River clients and listener owned by
        # kernel fibers (S0WORKERS_RESTART_OWNER=kernel). The frozen-scale run is restart-full.yml.
        continue-on-error: true
        env:
          S0_ADMIN_DSN: ${{ env.DSN_BASE }}/s0restartfull?sslmode=disable
          S0_EXPECT_DATABASE: s0restartfull
          S0_WORKER_RESTART_FULL: "1"
          S0_WORKER_RESTART_FULL_CYCLES: "1"
          S0_WORKER_RESTART_FULL_COMBINED_CYCLES: "1"
          S0_WORKER_RESTART_FULL_WARMUP_SECONDS: "5"
          S0_WORKER_RESTART_FULL_WINDOW_SECONDS: "20"
          S0_WORKER_RESTART_FULL_RECOVERY_IDS: "100"
          S0WORKERS_RESTART_OWNER: kernel
          GOMAXPROCS: "8"
        run: go test -count=1 -v -timeout 15m -run '^TestWorkerRestartFullGate$' ./plugins/jobs-river/internal/s0workers
      - name: Typed operations probe
        env:
          S0_TYPED_DSN: ${{ env.DSN_BASE }}/s0typed?sslmode=disable
          S0_TYPED_EXPECT_DATABASE: s0typed
        run: go test -race -count=1 -v ./plugins/jobs-river/internal/s0typedops
      - name: SQL authority boundary (known open S0 gate, expected to fail)
        # Recorded as failed in docs/design/s0-progress.md. Kept visible here
        # and not allowed to hide a regression in the steps above.
        continue-on-error: true
        env:
          S0_ADMIN_DSN: ${{ env.DSN_BASE }}/s0probe?sslmode=disable
          S0_EXPECT_DATABASE: s0probe
        run: go test -race -count=1 -v ./plugins/jobs-river/internal/s0probe

  oracle:
    name: Reference oracle comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # ponytail: the witness tests hard-code this path; make it configurable
      # when a second environment needs a different location.
      NODE_HOME: /tmp/aiops-s0-node-24.22.1-u4gdr6qr
      NODE_SHA256: 6c172a9ab6718f7b801fb5a7bd486af2ee5e32758086a04b84fcce2aa77095e6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.8" # toolchain directive in go.mod
      - name: Install the pinned Node.js runtime
        run: |
          curl -fsSLO https://nodejs.org/dist/v24.22.1/node-v24.22.1-linux-x64.tar.xz
          echo "$NODE_SHA256  node-v24.22.1-linux-x64.tar.xz" | sha256sum -c -
          mkdir -p "$NODE_HOME"
          tar -xJf node-v24.22.1-linux-x64.tar.xz -C "$NODE_HOME" --strip-components=1
          echo "S0_NODE=$NODE_HOME/bin/node" >> "$GITHUB_ENV"
      - name: Live oracle replay of the scenario corpus
        env:
          S0_ORACLE_RUN: "1"
        run: go test -race -count=1 ./test/differential
      - name: Causal comparison of both candidates against the oracle
        env:
          S0_ORACLE_RUN: "1"
          S0_CAUSAL_RUN: "1"
        run: go test -race -count=1 ./test/spike/s0/replay
