bindings:
  providers:
    configRefsDryRun:
      - aiops/config-refs
    configRefsReady:
      - aiops/config-refs
  consumers:
    appExit:
      - aiops/cli
      - aiops/restart-policy
    loader:
      - aiops/reload
    operations:
      - aiops/command-key
    profileContext:
      - aiops/command-profile
      - aiops/loader
      - aiops/readiness
      - aiops/reload
    registry:
      - aiops/restart-policy
    reload:
      - aiops/reload-socket
  sealedHooks:
    internal/config:
      - aiops/config-refs
    internal/status:
      - aiops/readiness
      - aiops/restart-policy
  required:
    keys: [clock]
    rows: [loader, readiness, reload, restart-policy]
acceptLicenses: []
serves:
  pluginApi: "0.3"
  kernel:
    keys:
      hooks:
        provider: open
        consumer: open
      logger:
        provider: open
        consumer: open
      reflect:
        provider: open
        consumer: open
      registry:
        provider: open
        consumer: bound
    hooks:
      internal/commit:
        stages: [default]
        access: sealed
        remote: "no"
      internal/config:
        stages: [default]
        access: sealed
        remote: "no"
      internal/plugin:
        stages: [default]
        access: sealed
        remote: "no"
      internal/service:
        stages: [default]
        access: sealed
        remote: "no"
      internal/status:
        stages: [default]
        access: sealed
        remote: "no"
      internal/update:
        stages: [default]
        access: sealed
        remote: "no"
  definitions:
    clock:
      - version: "0.1"
        suite: 1
        classes:
          clock:
            provider: open
            consumer: open
    commands:
      - version: "0.1"
        suite: 1
        classes:
          commands:
            provider: open
            consumer: open
    composition:
      - version: "0.1"
        suite: 1
        classes:
          composition:
            provider: open
            consumer: open
    configrefs:
      - version: "0.1"
        suite: 1
        classes:
          configRefsDryRun:
            provider: bound
            consumer: open
    launch:
      - version: "0.2"
        compatibleFrom: "0.1"
        suite: 2
        classes:
          appExit:
            provider: bound
            consumer: bound
          catalog:
            provider: bound
            consumer: open
          cmdline:
            provider: bound
            consumer: open
          killSwitches:
            provider: bound
            consumer: open
          profileContext:
            provider: bound
            consumer: bound
          ready:
            provider: bound
            consumer: open
    loader:
      - version: "0.2"
        compatibleFrom: "0.1"
        suite: 1
        classes:
          loader:
            provider: open
            consumer: bound
        hooks:
          loader/entry-init:
            stages: [default]
            access: sealed
            remote: "no"
          loader/patch-context:
            stages: [default]
            access: sealed
            remote: "no"
          loader/volatile-update:
            stages: [default]
            access: sealed
            remote: "no"
    operations:
      - version: "0.1"
        suite: 1
        classes:
          operations:
            provider: open
            consumer: bound
    reload:
      - version: "0.2"
        compatibleFrom: "0.1"
        suite: 1
        classes:
          reload:
            provider: open
            consumer: bound
        hooks:
          composition/applied:
            stages: [default]
            access: open
            remote: "no"
          reload/operation:
            stages: [default]
            access: open
            remote: "no"
