  aiops/restart-policy:
    package: github.com/mutex-solutions/aiops-platform/plugins/restart-policy
    manifest: |
      # The hand-written half of the manifest (07-c4-plugin-sdk.md section 2; ADR-048).
      # plugingen writes the generated half below the marker from the plugin's value:
      # go run ./tools/plugingen -write <dir>. CI fails when it differs.
      manifestVersion: "1.0"
      id: aiops/restart-policy
      version: 0.1.0
      title: Restart policy
      description: Retries a FAILED fiber in place with backoff, gives up after N failures in a window and, for an infrastructure provider, asks the launcher to replace the process.
      license: Apache-2.0
      publisher: {id: aiops}
      stability: experimental
      scope: [process]
      runtimes: [inproc]
      # --- generated by plugingen from the Spec; CI fails on a difference ---
      uses:
        - {key: appExit, major: 0, as: need}
        - {key: catalog, major: 0, as: need}
        - {key: clock, major: 0, as: need}
        - {key: composition, major: 0, as: need}
        - {key: logger, major: 0, as: need}
        - {key: registry, major: 0, as: need}
      provides: []
      registers: []
      hooks:
        - {hook: internal/status, stage: default}
        - {hook: reload/operation, stage: default}
      configSchema:
        $schema: https://json-schema.org/draft/2020-12/schema
        additionalProperties: false
        properties:
          backoffMax:
            pattern: ^[-+]?(0|(([0-9]+(\.[0-9]*)?|\.[0-9]+)(ns|us|µs|μs|ms|s|m|h))+)$
            type: string
          backoffMin:
            pattern: ^[-+]?(0|(([0-9]+(\.[0-9]*)?|\.[0-9]+)(ns|us|µs|μs|ms|s|m|h))+)$
            type: string
          factor:
            type: integer
          infrastructure:
            items:
              type: string
            type: array
          maxFailures:
            type: integer
          stable:
            pattern: ^[-+]?(0|(([0-9]+(\.[0-9]*)?|\.[0-9]+)(ns|us|µs|μs|ms|s|m|h))+)$
            type: string
          window:
            pattern: ^[-+]?(0|(([0-9]+(\.[0-9]*)?|\.[0-9]+)(ns|us|µs|μs|ms|s|m|h))+)$
            type: string
        type: object
      durable: []
      requires:
        pluginApi: "0.2"
        definitions:
          clock: ["0.1"]
          composition: ["0.1"]
          launch: ["0.2"]
          reload: ["0.1"]
    attestation: '{"_type":"https://in-toto.io/Statement/v1","predicate":{"definitions":{"clock":{"version":"0.1"},"composition":{"version":"0.1"},"launch":{"version":"0.2"},"reload":{"version":"0.1"}}},"predicateType":"https://github.com/mutex-solutions/aiops-platform/attestation/conformance/v1","subject":[{"digest":{"sha256":"9940eb1bb1ae58832431be34643791b9df0615916d6d1e9e9bec3d80bacd0c23"},"name":"aiops/restart-policy@0.1.0"}]}'
