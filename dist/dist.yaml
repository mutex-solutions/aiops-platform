# The builder's input for the release (ADR-060 decision 20; 08-profiles-roadmap-adrs.md:451,
# :1220): its module list, both binding maps, the sealed-hook listeners and the required
# set. The bindings and the required set of each later plugin are added with the plugin.
#
# The module list: the import path of each package that declares a plugin. ADD A PLUGIN
# HERE, with its bindings below; then go run ./tools/plugingen --write . generates the
# release module table dist/modules.go and writes distribution.yaml again, and make check
# fails when either differs. The list holds the loader, the five core rows of S1,
# reload-socket (ADR-062), and the cli row, the command rows and the operations row of
# aiops-cli (ADR-061 decisions 14, 24 and 30); the others arrive with their own steps.
modules:
  - github.com/mutex-solutions/aiops-platform/loader
  - github.com/mutex-solutions/aiops-platform/plugins/cli
  - github.com/mutex-solutions/aiops-platform/plugins/clock
  - github.com/mutex-solutions/aiops-platform/plugins/command-dist
  - github.com/mutex-solutions/aiops-platform/plugins/command-key
  - github.com/mutex-solutions/aiops-platform/plugins/command-plugin
  - github.com/mutex-solutions/aiops-platform/plugins/command-profile
  - github.com/mutex-solutions/aiops-platform/plugins/command-trust
  - github.com/mutex-solutions/aiops-platform/plugins/config-refs
  - github.com/mutex-solutions/aiops-platform/plugins/operations
  - github.com/mutex-solutions/aiops-platform/plugins/readiness
  - github.com/mutex-solutions/aiops-platform/plugins/reload
  - github.com/mutex-solutions/aiops-platform/plugins/reload-socket
  - github.com/mutex-solutions/aiops-platform/plugins/restart-policy
#
# Provider-bound keys: only config-refs provides configRefsReady, the key that every row
# whose config holds a reference injects (ADR-059, "configRefsReady"), and the dry run of
# references that the launcher calls at admission (ADR-059 decision 16).
providers:
  configRefsDryRun: [aiops/config-refs]
  configRefsReady: [aiops/config-refs]
# Consumer-bound keys: restart-policy resolves registry (the fiber lookup) and appExit
# (the exit request), and so does the cli row, which requests the exit of aiopsctl with
# the code of its command (ADR-061 decision 7); reload resolves loader
# (07-c4-plugin-sdk.md:557); the loader, reload and readiness resolve profileContext,
# which holds Commit, and so does the operations row, for the launcher's toolbox (ADR-061
# decisions 20 and 33); no command row does. reload-socket submits what aiopsctl asks over <home>/run/reload.sock until
# S6a (ADR-062); the other rows that submit are added with their plugin. The five command
# rows resolve operations, the one key they call besides commands (ADR-061 decisions 15
# and 20). This file lists who is allowed; gate check 7 reads the
# classes from the definitions (ADR-059 decision 20).
consumers:
  appExit: [aiops/restart-policy, aiops/cli]
  registry: [aiops/restart-policy]
  loader: [aiops/reload]
  profileContext: [aiops/loader, aiops/reload, aiops/readiness, aiops/operations]
  reload: [aiops/reload-socket]
  operations: [aiops/command-profile, aiops/command-plugin, aiops/command-dist, aiops/command-trust, aiops/command-key]
# Sealed hooks (07-c4-plugin-sdk.md:463): internal/status for the two rows that follow
# the state of every fiber, internal/config for the references.
sealedHooks:
  internal/status: [aiops/restart-policy, aiops/readiness]
  internal/config: [aiops/config-refs]
# The required set of every server profile that exists at S1 (08-profiles-roadmap-adrs.md:455).
# The loader is satisfied by boot's own mount. clock is a required key because
# restart-policy, a required row, needs it, and a required row must not need a
# provider outside the required set (08-profiles-roadmap-adrs.md:503).
requiredKeys: [clock]
requiredRows: [loader, restart-policy, reload, readiness]
