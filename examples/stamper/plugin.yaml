# The hand-written half of the manifest (07-c4-plugin-sdk.md section 2; ADR-048).
# plugingen writes the generated half below the marker from the plugin's value:
# go run ./tools/plugingen -write <dir>. CI fails when it differs.
# A toy plugin of the S2a test release, under the owner aiops (ADR-048 decision 14).
manifestVersion: "1.0"
id: aiops/example-stamper
version: 0.1.0
title: Example stamper
description: A toy stamper that contributes to stampers, for the S2a test release.
license: Apache-2.0
publisher: {id: aiops}
stability: experimental
scope: [process]
runtimes: [inproc]
# --- generated by plugingen from the Spec; CI fails on a difference ---
uses:
  - {key: stampers, major: 0, as: need}
provides: []
registers:
  - {key: stampers, major: 0}
hooks: []
configSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  additionalProperties: false
  properties:
    name:
      default: example
      examples:
        - seal
      type: string
  type: object
durable: []
requires:
  pluginApi: "0.2"
  definitions:
    stampers: ["0.1"]
