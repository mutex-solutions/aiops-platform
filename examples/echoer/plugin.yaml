# The hand-written half of the manifest (07-c4-plugin-sdk.md section 2; ADR-048).
# plugingen writes the generated half below the marker from the plugin's value:
# go run ./tools/plugingen -write <dir>. CI fails when it differs.
# A toy plugin of the S2a test release, under the owner aiops (ADR-048 decision 14).
manifestVersion: "1.0"
id: aiops/example-echoer
version: 0.1.0
title: Example echoer
description: A toy echoer whose row config fixes its reply; a pack with no code inserts its rows.
license: Apache-2.0
publisher: {id: aiops}
stability: experimental
scope: [process]
runtimes: [inproc]
instantiable: true
# --- generated by plugingen from the Spec; CI fails on a difference ---
uses:
  - {key: echoers, major: 0, as: need}
provides: []
registers:
  - {key: echoers, major: 0}
hooks: []
configSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  additionalProperties: false
  examples:
    - name: loud
      prefix: 'LOUD '
  properties:
    name:
      default: example
      examples:
        - loud
      type: string
    prefix:
      examples:
        - 'LOUD '
      type: string
  type: object
durable: []
requires:
  pluginApi: "0.3"
  definitions:
    echoers: ["0.1"]
