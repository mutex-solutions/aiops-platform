# The hand-written half of the manifest (07-c4-plugin-sdk.md section 2; ADR-048).
# plugingen writes the generated half below the marker from the plugin's value:
# go run ./tools/plugingen -write <dir>. CI fails when it differs.
# A toy plugin of the S2a test release, under the owner aiops (ADR-048 decision 14).
manifestVersion: "1.0"
id: aiops/example-caller
version: 0.1.0
title: Example caller
description: Calls every echoer and stamper through the dispatchers when a control file asks, and writes the replies to a file.
license: Apache-2.0
publisher: {id: aiops}
stability: experimental
scope: [process]
runtimes: [inproc]
# --- generated by plugingen from the Spec; CI fails on a difference ---
uses:
  - {key: clock, major: 0, as: need}
  - {key: cmdline, major: 0, as: need}
  - {key: echoers, major: 0, as: need}
  - {key: stampers, major: 0, as: need}
provides: []
registers: []
hooks: []
configSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  additionalProperties: false
  properties:
    dir:
      type: string
    interval:
      default: 25ms
      pattern: ^[-+]?(0|(([0-9]+(\.[0-9]*)?|\.[0-9]+)(ns|us|µs|μs|ms|s|m|h))+)$
      type: string
  type: object
durable: []
requires:
  pluginApi: "0.2"
  definitions:
    clock: ["0.1"]
    echoers: ["0.1"]
    launch: ["0.1"]
    stampers: ["0.1"]
