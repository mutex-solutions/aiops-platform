# The hand-written half of the manifest (07-c4-plugin-sdk.md section 2; ADR-048).
# plugingen writes the generated half below the marker from the plugin's value:
# go run ./tools/plugingen -write <dir>. CI fails when it differs.
manifestVersion: "1.0"
id: aiops/command-dist
version: 0.1.0
title: Distribution commands
description: The commands dist build, dist sign and dist use of aiopsctl, which build, sign and record a site distribution.
license: Apache-2.0
publisher: {id: aiops}
stability: experimental
scope: [process]
runtimes: [inproc]
# --- generated by plugingen from the Spec; CI fails on a difference ---
uses:
  - {key: commands, major: 0, as: need}
  - {key: operations, major: 0, as: need}
provides: []
registers:
  - {key: commands, major: 0}
hooks: []
configSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  additionalProperties: false
  properties: {}
  type: object
durable: []
requires:
  pluginApi: "0.3"
  definitions:
    commands: ["0.1"]
    operations: ["0.1"]
