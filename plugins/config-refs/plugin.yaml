# The hand-written half of the manifest (07-c4-plugin-sdk.md section 2; ADR-048).
# plugingen writes the generated half below the marker from the plugin's value:
# go run ./tools/plugingen -write <dir>. CI fails when it differs.
manifestVersion: "1.0"
id: aiops/config-refs
version: 0.1.0
title: Config references
description: Resolves the closed references ${env|file|secret|flag:value} in a row's config before the row sees it.
license: Apache-2.0
publisher: {id: aiops}
stability: experimental
scope: [process]
runtimes: [inproc]
# --- generated by plugingen from the Spec; CI fails on a difference ---
uses:
  - {key: cmdline, major: 0, as: need}
provides:
  - {key: configRefsDryRun, major: 0}
  - {key: configRefsReady, major: 0}
registers: []
hooks:
  - {hook: internal/config, stage: default}
configSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  additionalProperties: false
  properties:
    maxFileBytes:
      type: integer
  type: object
durable: []
requires:
  pluginApi: "0.3"
  definitions:
    configrefs: ["0.1"]
    launch: ["0.2"]
