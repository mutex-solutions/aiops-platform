# The row of aiops/config-refs as an artifact carries it: one row, disabled
# (ADR-060 decision 19). Step 7 of plugin check packs it, and a distribution
# composes the row from bundles of its own.
- insert:
    - {id: config-refs, plugin: aiops/config-refs, roles: [api, worker], enabled: false, config: {maxFileBytes: 65536}}
