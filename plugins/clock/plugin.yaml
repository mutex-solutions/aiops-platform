# The hand-written half of the manifest (07-c4-plugin-sdk.md section 2; ADR-048).
# plugingen writes the generated half below the marker from the plugin's value:
# go run ./tools/plugingen -write <dir>. CI fails when it differs.
manifestVersion: "1.0"
id: aiops/clock
version: 0.1.0
title: Clock
description: Now and one-shot timers over the standard library; a timer is an effect of the fiber that starts it.
license: Apache-2.0
publisher: {id: aiops}
stability: experimental
scope: [process]
runtimes: [inproc]
# --- generated by plugingen from the Spec; CI fails on a difference ---
uses: []
provides:
  - {key: clock, major: 0}
registers: []
hooks: []
configSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  additionalProperties: false
  properties: {}
  type: object
durable: []
requires:
  pluginApi: "0.3"
  definitions:
    clock: ["0.1"]
