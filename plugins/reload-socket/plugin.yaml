# The hand-written half of the manifest (07-c4-plugin-sdk.md section 2; ADR-048).
# plugingen writes the generated half below the marker from the plugin's value:
# go run ./tools/plugingen -write <dir>. CI fails when it differs.
manifestVersion: "1.0"
id: aiops/reload-socket
version: 0.1.0
title: Reload socket
description: Carries the submissions of aiopsctl plugin enable, disable, remove and install to the reload queue over a Unix socket in run/, from S2a to S6a.
license: Apache-2.0
publisher: {id: aiops}
stability: experimental
scope: [process]
runtimes: [inproc]
# --- generated by plugingen from the Spec; CI fails on a difference ---
uses:
  - {key: cmdline, major: 0, as: need}
  - {key: reload, major: 0, as: need}
provides: []
registers: []
hooks: []
configSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  additionalProperties: false
  properties:
    dir:
      type: string
  type: object
durable: []
requires:
  pluginApi: "0.3"
  definitions:
    launch: ["0.2"]
    reload: ["0.2"]
