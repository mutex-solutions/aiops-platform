# The hand-written half of the manifest (07-c4-plugin-sdk.md section 2; ADR-048).
# plugingen writes the generated half below the marker from the plugin's value:
# go run ./tools/plugingen -write <dir>. CI fails when it differs.
manifestVersion: "1.0"
id: aiops/cli
version: 0.1.0
title: Command line
description: The dispatcher of the commands of aiopsctl; it runs the command that argv names once boot has finished and requests the exit with its code.
license: Apache-2.0
publisher: {id: aiops}
stability: experimental
scope: [process]
runtimes: [inproc]
# --- generated by plugingen from the Spec; CI fails on a difference ---
uses:
  - {key: appExit, major: 0, as: need}
  - {key: catalog, major: 0, as: need}
  - {key: cmdline, major: 0, as: need}
  - {key: composition, major: 0, as: need}
  - {key: ready, major: 0, as: need}
provides:
  - {key: commands, major: 0}
registers: []
hooks: []
configSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  additionalProperties: false
  properties: {}
  type: object
durable: []
requires:
  pluginApi: "0.3"
  definitions:
    commands: ["0.1"]
    composition: ["0.1"]
    launch: ["0.2"]
