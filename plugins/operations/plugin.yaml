# The hand-written half of the manifest (07-c4-plugin-sdk.md section 2; ADR-048).
# plugingen writes the generated half below the marker from the plugin's value:
# go run ./tools/plugingen -write <dir>. CI fails when it differs.
manifestVersion: "1.0"
id: aiops/operations
version: 0.1.0
title: Operations
description: The operations library of aiopsctl, which writes a home under its one write lock, signs and verifies in key mode, and records what it verified.
license: Apache-2.0
publisher: {id: aiops}
stability: experimental
scope: [process]
runtimes: [inproc]
# --- generated by plugingen from the Spec; CI fails on a difference ---
uses:
  - {key: profileContext, major: 0, as: need}
provides:
  - {key: operations, major: 0}
registers: []
hooks: []
configSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  additionalProperties: false
  properties:
    lockWait:
      default: 2m
      pattern: ^[-+]?(0|(([0-9]+(\.[0-9]*)?|\.[0-9]+)(ns|us|µs|μs|ms|s|m|h))+)$
      type: string
  type: object
durable: []
requires:
  pluginApi: "0.3"
  definitions:
    launch: ["0.2"]
    operations: ["0.2"]
