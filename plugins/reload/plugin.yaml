# The hand-written half of the manifest (07-c4-plugin-sdk.md section 2; ADR-048).
# plugingen writes the generated half below the marker from the plugin's value:
# go run ./tools/plugingen -write <dir>. CI fails when it differs.
manifestVersion: "1.0"
id: aiops/reload
version: 0.1.0
title: Reload
description: The one queue that changes the tree. Composes, admits, plans, applies in one batch, judges and publishes composition/applied for each submission.
license: Apache-2.0
publisher: {id: aiops}
stability: experimental
scope: [process]
runtimes: [inproc]
# --- generated by plugingen from the Spec; CI fails on a difference ---
uses:
  - {key: catalog, major: 0, as: need}
  - {key: loader, major: 0, as: need}
  - {key: profileContext, major: 0, as: need}
provides:
  - {key: reload, major: 0}
registers: []
hooks: []
configSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  additionalProperties: false
  properties:
    history:
      type: integer
    queue:
      type: integer
  type: object
durable: []
requires:
  pluginApi: "0.3"
  definitions:
    launch: ["0.2"]
    loader: ["0.2"]
    reload: ["0.1"]
