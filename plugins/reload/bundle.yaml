# The row of aiops/reload as an artifact carries it: one row, disabled
# (ADR-060 decision 19). Step 7 of plugin check packs it, and a distribution
# composes the row from bundles of its own.
- insert:
    - {id: reload, plugin: aiops/reload, roles: [api, worker], enabled: false, config: {queue: 8, history: 32}}
