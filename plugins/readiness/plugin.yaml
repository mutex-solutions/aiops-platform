# The hand-written half of the manifest (07-c4-plugin-sdk.md section 2). The
# generated half (uses, registers, configSchema, requires) comes with plugingen, S2a.
manifestVersion: "1.0"
id: aiops/readiness
version: 0.1.0
title: Readiness
description: Holds the ready latch while the required set is ACTIVE and drops it while a required provider restarts in place.
license: Apache-2.0
publisher: {id: aiops}
stability: experimental
scope: [process]
runtimes: [inproc]
provides: []
needs:
  - {key: profileContext, major: 0}
  - {key: catalog, major: 0}
  - {key: ready, major: 0}
  - {key: composition, major: 0}
  - {key: logger, major: 0}
hooks:
  - {hook: internal/status, stage: default}
  - {hook: composition/applied, stage: default}
  - {hook: reload/operation, stage: default}
