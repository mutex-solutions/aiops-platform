# The hand-written half of the manifest (07-c4-plugin-sdk.md section 2; ADR-048).
# plugingen writes the generated half below the marker from the plugin's value:
# go run ./tools/plugingen -write <dir>. CI fails when it differs.
manifestVersion: "1.0"
id: aiops/readiness
version: 0.1.0
title: Readiness
description: Holds the ready latch while the required set is ACTIVE and drops it while a required provider restarts in place.
license: Apache-2.0
publisher: {id: aiops}
stability: experimental
scope: [process]
runtimes: [inproc]
# --- generated by plugingen from the Spec; CI fails on a difference ---
uses:
  - {key: catalog, major: 0, as: need}
  - {key: composition, major: 0, as: need}
  - {key: logger, major: 0, as: need}
  - {key: profileContext, major: 0, as: need}
  - {key: ready, major: 0, as: need}
provides: []
registers: []
hooks:
  - {hook: composition/applied, stage: default}
  - {hook: internal/status, stage: default}
  - {hook: reload/operation, stage: default}
configSchema:
  $schema: https://json-schema.org/draft/2020-12/schema
  additionalProperties: false
  properties: {}
  type: object
durable: []
requires:
  pluginApi: "0.3"
  definitions:
    composition: ["0.1"]
    launch: ["0.2"]
    reload: ["0.1"]
