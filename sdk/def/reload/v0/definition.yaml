# Layout: 07-c4-plugin-sdk.md:525-534 (R13), fixed by ADR-060 decision 7.
# Contract: 03-c3-kernel.md:65 (`reload` is class `C`), 07-c4-plugin-sdk.md:557. The
# reload key owns composition/applied and reload/operation, both open and not remote
# (07-c4-plugin-sdk.md:461-462), and neither declares a stage. 0.2 adds the wire
# format of reload-socket and the status type (ADR-062 decision 8), so a plugin built
# for 0.1 is admitted.
key: reload
version: "0.2"
stability: preview
class: {provider: open, consumer: bound}
remote: "no"
compatibleFrom: "0.1"
suite: 1
hooks:
  composition/applied: {stages: [default], access: open, remote: "no"}
  reload/operation: {stages: [default], access: open, remote: "no"}
