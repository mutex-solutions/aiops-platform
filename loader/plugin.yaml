# The hand-written half of the manifest (07-c4-plugin-sdk.md section 2; ADR-048).
# plugingen writes the generated half below the marker from the plugin's value:
# go run ./tools/plugingen -write <dir>. CI fails when it differs.
# Written with kernel.Define: its config is a Go value boot writes, so its
# configSchema is {} (ADR-048 decision 9; ADR-060 decision 13).
manifestVersion: "1.0"
id: aiops/loader
version: 0.1.0
title: Loader
description: Mounts, updates and removes the rows of a composed tree in one batch, and provides the tree and the composition.
license: Apache-2.0
publisher: {id: aiops}
stability: experimental
scope: [process]
runtimes: [inproc]
# --- generated by plugingen from the Spec; CI fails on a difference ---
uses:
  - {key: catalog, major: 0, as: need}
  - {key: profileContext, major: 0, as: need}
provides:
  - {key: composition, major: 0}
  - {key: loader, major: 0}
registers: []
hooks: []
configSchema: {}
durable: []
requires:
  pluginApi: "0.2"
  definitions:
    composition: ["0.1"]
    launch: ["0.1"]
    loader: ["0.1"]
