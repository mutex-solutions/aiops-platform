# The stated exceptions of 00-decisions.md:267 (ADR-054 decisions 9, 19 and 21). U1 and
# U3 read an item's place when it is `every place`, `ids`, a directory of the repository
# with its trailing slash, or a documentation place of decision 22 written
# `00 §2.1 row <n>` where the item's tokens name its contract; any other place is prose
# that no check reads before its first case lands.
exceptions:
  - item: The PostgreSQL dialect behind sql, sql.Bound, platformSql and sqlDriver
    tokens: [postgres, postgresql, pgx]
    places: [those definitions and their suites, the sql fake and sdk/testkit/sqlfake, an import of pgx v5 in sdk/def/sql, the participants of sqlDriver, the suffix of a row on the allow-list that wraps it, 00 §2.1 row 9]
    source: 00-decisions.md:267; ADR-054 decision 23
  - item: The two query dialect keys, metricsQuery and logsQuery
    tokens: [promql, prometheus, logql, loki]
    places: [the definition of its key, its fake and its suite, in prose, doc comments and query text; logql and loki in prose only]
    source: 00-decisions.md:267
  - item: The protocols with several implementations
    tokens: [s3, openai, oidc, smtp, oci, otlp, kubernetes, k8s, mcp]
    places: [the definitions, fakes and suites that declare the protocol, ids]
    source: 00-decisions.md:267; ADR-054 decision 19
  - item: The Cordis semantics of the kernel port
    tokens: [cordis, deepseek, dsh]
    places: [sdk/kernel/, loader/, test/differential/, test/spike/s0/, their notices included, 00 §2.1 row 1]
    source: 00-decisions.md:267; 08 §5.1 L12
  - item: The default stack bundle (aiops-stack, agent-base and the agent bundles)
    tokens: [the names of every entry whose plugins sit in one of those bundles]
    places: [the code and content of those plugins and their config in the golden dumps, never an id]
    source: 00-decisions.md:267
  - item: The Go language and SPDX identifiers
    tokens: [go, golang, spdx]
    places: [every place]
    source: ADR-054 decision 21

# The base provider allow-list (ADR-054 decision 10).
baseProviders: [sql-postgres, sql-platform, kv-postgres, blob-s3, llm-provider-openai-compatible, identity-oidc, notifier-email, jobs-river]
