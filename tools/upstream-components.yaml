# The upstream register (ADR-054; 08-profiles-roadmap-adrs.md §5.1 L3; licence record
# §7.2). One entry per upstream and per content source, with the keys of ADR-054
# decision 3 and the values of decision 4; `exceptions`, the stated exceptions of
# 00-decisions.md:267 (decision 9); `baseProviders`, the base provider allow-list
# (decision 10). `go run ./tools/register .` runs the register check U7 (decision 12),
# the name lint U1 (decisions 14 and 22) and suite neutrality U3 (decision 15);
# `go run ./tools/kernelcheck imports . tools/upstream-components.yaml` runs the import
# boundary U2 (decision 13).
#
# A dependency lands in one commit with its entry, its reading at the pinned version
# and the row of the licence record (decisions 7 and 16). A version bump reads the
# licence again in the same commit (decision 6). The entries at S2a are those of
# decision 8 and the five items refused by name of decision 20.
#
# Completeness is over package graphs (decisions 12 and 18): every module that the
# package graph of a module of the repository, tests included, reaches (go list -deps
# -test) has an entry or sits in the contains of the entry that brings it in. A module
# that a go.sum lists and no such graph reaches, as a dependency of an upstream's own
# tests is (github.com/jackc/pgerrcode, github.com/robfig/cron/v3 and
# github.com/stretchr/testify with its dependencies at S2a), is linked by nothing and
# needs no entry; it gets one when a graph first reaches it.
entries:
  - id: go
    names: [go, golang]
    form: library
    behind: none
    pin: go1.26.8
    licence: BSD-3-Clause
    verdict: ok
    modes: [link]
    evidence:
      - {source: golang.org/toolchain@v0.0.1-go1.26.8.linux-amd64 LICENSE and PATENTS, read: "2026-11-23", version: go1.26.8}
    mark: needs-approval
    default: true

  - id: go-toolchain
    names: [go, golang]
    form: process
    behind: none
    pin: go1.26.8
    # Per directory (ADR-054 decision 8): BSD-3-Clause in LICENSE and in the vendored
    # golang.org/x modules; Apache-2.0 in src/cmd/vendor/github.com/google/pprof; the
    # OpenSSL and SSLeay licences, ISC and an Intel BSD-3-Clause text in
    # src/crypto/internal/boring/LICENSE.
    licence: BSD-3-Clause AND Apache-2.0 AND OpenSSL AND ISC
    verdict: ok-with-conditions
    modes: [tool]
    conditions:
      - {condition: "No binary links the BoringSSL objects: they need GOEXPERIMENT=boringcrypto and cgo, and every build runs with cgo off", row: L7}
      - {condition: "The builder image that ships the toolchain carries every licence text of it, with the acknowledgments the OpenSSL and SSLeay licences ask", row: L7}
    evidence:
      - {source: "golang.org/toolchain@v0.0.1-go1.26.8.linux-amd64 LICENSE, PATENTS and the licence files under src/", read: "2026-11-23", version: go1.26.8}
    mark: needs-approval
    default: false

  - id: cordis
    names: [cordis, deepseek, dsh]
    form: port
    behind: none
    pin: fcc0ad462172522aaf5c93a7b2e01f6b9f0b0159
    licence: MIT
    verdict: ok-with-conditions
    modes: [copy]
    conditions:
      - {condition: "NOTICE, sdk/kernel, loader/ and the oracle carry both MIT notices, of the upstream author and of the repository that holds the modifications", row: L12}
    evidence:
      - {source: test/differential/oracle/vendor/cordis/LICENSE and test/differential/oracle/notices/DeepSeek-MIT.txt, read: "2026-11-23", version: "@deepseek-ai/cordis 4.1.0 at fcc0ad4621"}
      - {source: test/differential/oracle/vendor/loader/LICENSE, read: "2026-11-23", version: "@deepseek-ai/cordis-plugin-loader 1.1.0 at fcc0ad4621"}
    mark: never
