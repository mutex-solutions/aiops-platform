      - {source: "github.com/russross/blackfriday@v1.6.0 LICENSE.txt and github.com/santhosh-tekuri/jsonschema/v5@v5.3.1 LICENSE", read: "2026-11-24", version: v1.1.1}
    mark: needs-approval
