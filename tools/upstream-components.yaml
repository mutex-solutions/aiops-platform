  - id: x-mod
    names: [x-mod]
    form: library
    behind: operations
    modules: [golang.org/x/mod]
    pin: v0.42.0
    licence: BSD-3-Clause
    verdict: ok
    modes: [link]
    evidence:
      - {source: "golang.org/x/mod@v0.42.0 LICENSE (BSD-3-Clause, Copyright 2009 The Go Authors), PATENTS and go.mod", read: "2026-11-24", version: v0.42.0}
    mark: needs-approval
    importers:
      - {dir: plugins/operations, decision: "ADR-047 decision 1: the module layer and the SBOM of in-process code"}
    default: false

