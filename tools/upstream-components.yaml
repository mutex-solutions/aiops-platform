  # The signature library of ADR-020: sigstore-go and the three modules that the operations
  # library imports beside it, each at its pin (ADR-020 decisions 1, 16, 19 and 20). The
  # licences are read in the module cache at these pins, from the licence file at the root
  # of each module, classified by the texts it holds as ADR-020 decision 16 states; the
  # other modules of the package graph are in the contains of sigstore-go.
  - id: sigstore-go
    names: [sigstore, sigstore-go]
    form: library
    behind: operations
    modules: [github.com/sigstore/sigstore-go]
    pin: v1.3.0
    licence: Apache-2.0
    verdict: ok-with-conditions
    modes: [link]
    conditions:
      - {condition: "Linked without its pkg/sign, which adds eleven modules, two of them MPL-2.0 (ADR-020 decision 20)", row: L7}
      - {condition: "Every artifact that links it carries in THIRD_PARTY_LICENSES/ the NOTICE files of go-openapi/jsonpointer, go-openapi/jsonreference, go-openapi/runtime, go-tuf/v2 and grpc (NOTICE.txt), the PATENTS files of x/crypto, x/mod, x/net, x/sync, x/sys, x/term, x/text and protobuf, the full Apache-2.0 text beside the notices of json-canonicalization, in-toto/attestation and in-toto-golang, the licence files of the three OpenTelemetry modules whole, GO-LICENSE of go-pathspec beside its LICENSE, and the MIT file of go-openapi/runtime/middleware/denco (ADR-020 decision 16)", row: L7}
      - {condition: "LICENSE.docs of github.com/opencontainers/go-digest@v1.0.0 is CC-BY-SA-4.0 for its README.md and CONTRIBUTING.md only, which no binary links; the per-directory scan honours that record by module, version and file (ADR-020 decision 30, reading 4; ADR-047 decision 21)", row: L16}
      - {condition: "The builder builds every binary with the tag grpcnotrace, which drops golang.org/x/net/trace and its two default-mux handlers, and its init deny-list exempts one registration, the codec of package google.golang.org/grpc/encoding/proto (RegisterCodecV2) at google.golang.org/grpc v1.82.1, read again at every version bump (ADR-020 decision 27; ADR-044 decision 21)", row: L16}
